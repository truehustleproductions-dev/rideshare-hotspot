<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><meta name="description" content="Personal AI-powered rideshare companion"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fa;background:#07090d;--muted:#8f98a8;--line:#202631;--panel:#10141b;--panel2:#151b24;--accent:#8cf7c5;--warn:#ffcc66;--bad:#ff7b7b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17202d 0,#07090d 42%);min-height:100vh}button,input,select,textarea{font:inherit}button{color:inherit}#app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(88px + env(safe-area-inset-bottom))}header{height:92px;display:flex;align-items:center;justify-content:space-between}header small{letter-spacing:.18em;color:var(--accent);font-size:10px}h1{margin:4px 0 0;font-size:25px}.pill,.back{border:1px solid var(--line);background:#11161e;border-radius:999px;padding:11px 15px;font-size:12px}.screen{display:none}.screen.active{display:block}.hero{height:180px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,#111822,#090c11);position:relative;overflow:hidden;margin-bottom:14px}.mapglow{position:absolute;inset:-30%;background:radial-gradient(circle at 70% 40%,rgba(140,247,197,.25),transparent 24%),linear-gradient(120deg,transparent 47%,rgba(140,247,197,.12) 48%,transparent 49%);transform:rotate(-8deg)}.shift{position:absolute;left:22px;bottom:20px;display:flex;flex-direction:column}.shift span{font-size:10px;letter-spacing:.15em;color:var(--muted)}.shift b{font-size:34px}.shift em{font-style:normal;color:var(--muted);font-size:12px}.voice{width:100%;min-height:132px;border:1px solid rgba(140,247,197,.35);border-radius:28px;background:linear-gradient(180deg,rgba(140,247,197,.13),rgba(140,247,197,.05));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.voice span{font-size:35px;color:var(--accent)}.voice b{font-size:20px;letter-spacing:.04em}.voice small,.grid small,.cards small{color:var(--muted);display:block;margin-top:5px}.grid,.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid button,.cards button{min-height:108px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);font-weight:700}.cards button{min-height:94px}.cards button:first-child{grid-column:1/-1;background:linear-gradient(135deg,#15261f,#10151b);border-color:#29483a}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:rgba(7,9,13,.92);backdrop-filter:blur(18px);padding:12px 22px calc(12px + env(safe-area-inset-bottom));gap:10px}nav button{flex:1;height:50px;border:1px solid var(--line);border-radius:16px;background:#0d1117;font-size:12px;font-weight:800}.back{margin-bottom:14px}.panelcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}.panelcard h2{margin:0 0 12px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}input,select,textarea{width:100%;background:#090d12;color:#fff;border:1px solid #2a313d;border-radius:14px;padding:14px;min-height:48px}textarea{min-height:86px}.primary,.secondary,.danger{width:100%;min-height:54px;border:0;border-radius:16px;font-weight:800;margin-top:8px}.primary{background:var(--accent);color:#07110d}.secondary{background:#1a222d}.danger{background:#2a1719;color:#ffb1b1}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.metric span{color:var(--muted)}.good{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.trip{padding:14px 0;border-bottom:1px solid var(--line)}.trip:last-child{border:0}.trip b{display:block}.trip small{color:var(--muted)}.status{display:inline-block;padding:5px 8px;border:1px solid #303947;border-radius:999px;font-size:10px;margin-top:7px}.toggle{display:flex;align-items:center;justify-content:space-between}.toggle input{width:48px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.bigmoney{font-size:38px;font-weight:800}.capturetabs{display:flex;gap:8px;margin-bottom:12px}.capturetabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:#10151c}.preview{max-width:100%;border-radius:16px;margin-top:10px}.actionbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actionbar .primary:last-child:nth-child(odd){grid-column:1/-1}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#0b1016;border:1px solid var(--line);border-radius:16px;padding:14px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:22px}.timeline{border-left:2px solid #27303c;margin-left:8px;padding-left:16px}.event{margin:0 0 14px}.event small{color:var(--muted)}.chip{display:inline-block;border:1px solid #34404d;border-radius:999px;padding:5px 8px;font-size:10px;margin:3px 4px 0 0}.dangertext{color:var(--bad)}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#10151c}.empty{text-align:center;padding:26px 10px;color:var(--muted)} @media(max-width:360px){.grid,.cards{grid-template-columns:1fr}.cards button:first-child{grid-column:auto}}

</style><title>Rideshare OS</title></head><body>
<div id="app">
<header><div><small>RIDESHARE OS</small><h1 id="screenTitle">Driving Mode</h1></div><button id="modeBtn" class="pill">PARKED</button></header>
<main>
<section id="drive" class="screen active"><div class="hero"><div class="mapglow"></div><div class="shift"><span>SHIFT</span><b id="shiftGross">$0.00</b><em id="shiftMeta">0 trips · $0.00/hr</em></div></div><button id="voiceBtn" class="voice"><span>◉</span><b>VOICE CAPTURE</b><small>Tap, then speak the offer</small></button><div class="grid"><button data-go="current">CURRENT TRIP<small id="currentState">No active trip</small></button><button data-go="hotspots">HOTSPOT<small>Personal intelligence</small></button><button data-go="home">GET ME HOME<small>Route toward home</small></button><button data-go="earnings">EARNINGS<small id="outstandingMini">$0 outstanding</small></button></div></section>
<section id="parked" class="screen"><div class="cards"><button data-go="capture">＋ Capture Trip<small>Voice · Screenshot · Manual</small></button><button data-go="history">Black Box<small>Trip history & evidence</small></button><button data-go="earnings">Earnings Guardian<small>Expected vs actual</small></button><button data-go="analytics">Shift Analytics<small>Performance & opportunity cost</small></button><button data-go="hotspots">Hotspot Intelligence<small>Learn from your history</small></button><button data-go="copilot">AI Copilot<small>Ask your structured data</small></button><button data-go="settings">Settings<small>Work zones · Home · Privacy</small></button></div></section>
<section id="panel" class="screen"><button id="back" class="back">‹ Back</button><div id="panelBody"></div></section>
</main><nav><button data-root="drive">DRIVE</button><button data-root="parked">PARKED</button></nav></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='rideshare_os_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{trips:[],settings:{toronto:false,home:'',detourKm:12,homePriority:'balanced',autoDelayHours:72,costPerKm:.28},shiftStart:Date.now(),shiftHistory:[],memory:[]};
db.settings={toronto:false,home:'',detourKm:12,homePriority:'balanced',autoDelayHours:72,costPerKm:.28,...(db.settings||{})}; db.shiftHistory=db.shiftHistory||[]; db.memory=db.memory||[];
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));refresh()};
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n||0)); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tripBase(source){return{id:crypto.randomUUID(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),platform:'Uber',state:'OFFER CAPTURED',pickupArea:'',dropoffArea:'',offeredFare:null,expectedFare:null,actualFare:null,actualPayment:null,paymentTimestamp:null,estimatedKm:null,estimatedMinutes:null,paidKm:null,unpaidKm:null,deadheadKm:null,notes:'',evidence:[],provenance:{},changes:[],source}}
function setField(t,k,v,source){if(v===''||v==null)return;if(t[k]!=null&&t[k]!==''&&String(t[k])!==String(v))t.changes.push({field:k,from:t[k],to:v,source,at:new Date().toISOString()});t[k]=v;t.provenance[k]=source;t.updatedAt=new Date().toISOString()}
function parseVoice(text){let t=tripBase('VOICE');setField(t,'notes',text,'VOICE');let fare=text.match(/\$?\s*(\d+(?:\.\d{1,2})?)/);if(fare)setField(t,'offeredFare',+fare[1],'VOICE');let p=text.match(/pickup(?: is| in| at)?\s+(.+?)(?:\.|,| drop| destination| going)/i);let d=text.match(/(?:drop[- ]?off|destination|going to)(?: is| in| at)?\s+(.+?)(?:\.|,| uber| lyft| offering| for|$)/i);if(p)setField(t,'pickupArea',p[1].trim(),'VOICE');if(d)setField(t,'dropoffArea',d[1].trim(),'VOICE');if(/lyft/i.test(text))setField(t,'platform','Lyft','VOICE');if(fare)setField(t,'expectedFare',+fare[1],'SYSTEM_INFERENCE');return t}
function refresh(){let completed=db.trips.filter(t=>['COMPLETED','EXPECTED PAYMENT','PAID','PAYMENT DELAYED','UNDER REVIEW','DISCREPANCY','RECONCILED'].includes(t.state));let gross=completed.reduce((a,t)=>a+Number(t.actualFare??t.expectedFare??t.offeredFare??0),0),hrs=Math.max((Date.now()-db.shiftStart)/36e5,.01),out=db.trips.reduce((a,t)=>a+Math.max(0,Number(t.expectedFare||t.offeredFare||0)-Number(t.actualPayment||0)),0);$('#shiftGross').textContent=money(gross);$('#shiftMeta').textContent=`${completed.length} trips · ${money(gross/hrs)}/hr`;$('#outstandingMini').textContent=`${money(out)} outstanding`;let active=db.trips.find(t=>!['PAID','RECONCILED'].includes(t.state)&&!['OFFER CAPTURED'].includes(t.state));$('#currentState').textContent=active?`${active.state} · ${active.dropoffArea||'Trip'}`:'No active trip'}
function root(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$('#screenTitle').textContent=id==='drive'?'Driving Mode':'Parked Mode';$('#modeBtn').textContent=id==='drive'?'PARKED':'DRIVE'}
function panel(title,html){root('panel');$('#screenTitle').textContent=title;$('#panelBody').innerHTML=html}
$('#modeBtn').onclick=()=>root($('#drive').classList.contains('active')?'parked':'drive');$('#back').onclick=()=>root('parked');$$('[data-root]').forEach(b=>b.onclick=()=>root(b.dataset.root));$$('[data-go]').forEach(b=>b.onclick=()=>openPanel(b.dataset.go));
function openPanel(name){if(name==='capture')return capture();if(name==='history')return history();if(name==='earnings')return earnings();if(name==='analytics')return analytics();if(name==='settings')return settings();if(name==='home')return home();if(name==='hotspots')return hotspots();if(name==='copilot')return copilot();if(name==='current')return current()}
function formHTML(t={}){return `<div class="row"><div class="field"><label>Platform</label><select id="platform"><option>Uber</option><option>Lyft</option></select></div><div class="field"><label>Offer CAD</label><input id="fare" type="number" step=".01" value="${t.offeredFare??''}"></div></div><div class="field"><label>Pickup area</label><input id="pickup" value="${t.pickupArea||''}"></div><div class="field"><label>Drop-off area</label><input id="dropoff" value="${t.dropoffArea||''}"></div><div class="row"><div class="field"><label>Est. km</label><input id="km" type="number" step=".1" value="${t.estimatedKm??''}"></div><div class="field"><label>Est. minutes</label><input id="mins" type="number" value="${t.estimatedMinutes??''}"></div></div><div class="field"><label>Notes</label><textarea id="notes">${t.notes||''}</textarea></div>`}
function capture(pref='manual',seed=null){panel('Capture Trip',`<div class="capturetabs"><button id="tabVoice">Voice</button><button id="tabShot">Screenshot</button><button id="tabManual">Manual</button></div><div id="captureBody"></div>`);$('#tabVoice').onclick=()=>voiceCapture();$('#tabShot').onclick=()=>shotCapture();$('#tabManual').onclick=()=>manualCapture(seed);pref==='voice'?voiceCapture():pref==='shot'?shotCapture():manualCapture(seed)}
function manualCapture(seed={}){$('#captureBody').innerHTML=`<div class="panelcard"><h2>Manual offer</h2>${formHTML(seed)}<button class="primary" id="saveTrip">Save offer</button></div>`;$('#saveTrip').onclick=()=>{let t=tripBase('MANUAL');[['platform',$('#platform').value],['offeredFare',+$('#fare').value||null],['expectedFare',+$('#fare').value||null],['pickupArea',$('#pickup').value],['dropoffArea',$('#dropoff').value],['estimatedKm',+$('#km').value||null],['estimatedMinutes',+$('#mins').value||null],['notes',$('#notes').value]].forEach(([k,v])=>setField(t,k,v,k==='expectedFare'?'SYSTEM_INFERENCE':'MANUAL'));db.trips.unshift(t);save();editTrip(t.id)} }
function voiceCapture(){$('#captureBody').innerHTML=`<div class="panelcard"><h2>Voice capture</h2><p class="hint">Say the offer naturally. Example: “Pickup is Vaughan. Drop-off is Barrie. Uber is offering me $42.”</p><button class="voice" id="listen"><span>◉</span><b>START LISTENING</b></button><div id="heard" class="hint"></div></div>`;$('#listen').onclick=async()=>{const out=$('#heard'),btn=$('#listen');if(!window.isSecureContext){out.innerHTML='<span class="bad">Microphone requires the installed HTTPS app. This page is not running in a secure context.</span>';return}try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){let stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}}catch(e){out.innerHTML='<span class="bad">Microphone permission was blocked. Open your browser site settings for this app and allow Microphone, then try again.</span>';return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){out.innerHTML='<span class="bad">Live speech recognition is not available in this browser. Manual capture remains available.</span>';return}let r=new SR();r.lang='en-CA';r.interimResults=false;r.continuous=false;btn.querySelector('b').textContent='LISTENING…';out.textContent='Listening…';r.onresult=e=>{let text=e.results[0][0].transcript,t=parseVoice(text);out.textContent='Heard: '+text;db.trips.unshift(t);save();setTimeout(()=>editTrip(t.id),350)};r.onerror=e=>{btn.querySelector('b').textContent='START LISTENING';let m={"not-allowed":'Microphone/speech permission was denied. Allow Microphone for this site and try again.',"audio-capture":'No microphone is available to the browser.',"network":'Speech recognition could not reach its recognition service. Check your connection.'}[e.error]||('Voice recognition error: '+e.error);out.innerHTML='<span class="bad">'+m+'</span>'};r.onend=()=>btn.querySelector('b').textContent='START LISTENING';try{r.start()}catch(e){out.innerHTML='<span class="bad">Could not start voice capture: '+e.message+'</span>'}}}
$('#voiceBtn').onclick=()=>capture('voice');
function shotCapture(){$('#captureBody').innerHTML=`<div class="panelcard"><h2>Screenshot offer</h2><p class="hint">Upload an offer screenshot. With OPENAI_API_KEY configured on the server, vision extracts fields. Without it, the screenshot is still preserved as evidence and you can enter fields manually.</p><input id="shot" type="file" accept="image/*"><div id="shotStatus"></div></div>`;$('#shot').onchange=()=>{let f=$('#shot').files[0];if(!f)return;let rd=new FileReader();rd.onload=async()=>{let image=rd.result;$('#shotStatus').innerHTML=`<img class="preview" src="${image}"><p class="hint">Extracting…</p>`;try{let r=await fetch('/api/extract-screenshot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})}),j=await r.json();if(!r.ok)throw Error(j.error);let data=JSON.parse(j.text.replace(/^```json\s*|```$/g,''));let t=tripBase('SCREENSHOT');Object.entries(data).forEach(([k,v])=>setField(t,k,v,'SCREENSHOT'));if(t.offeredFare)setField(t,'expectedFare',t.offeredFare,'SYSTEM_INFERENCE');t.evidence.push({type:'screenshot',data:image,at:new Date().toISOString()});db.trips.unshift(t);save();editTrip(t.id)}catch(e){let t=tripBase('SCREENSHOT');t.evidence.push({type:'screenshot',data:image,at:new Date().toISOString()});db.trips.unshift(t);save();$('#shotStatus').innerHTML+=`<p class="warn">AI extraction unavailable: ${e.message}</p><button class="primary" id="fill">Continue with screenshot evidence</button>`;$('#fill').onclick=()=>editTrip(t.id)}};rd.readAsDataURL(f)}}
function derived(t){let expected=Number(t.expectedFare??t.offeredFare??0),paid=Number(t.actualPayment||0),km=Number(t.estimatedKm||t.paidKm||0),mins=Number(t.estimatedMinutes||0),dead=Number(t.deadheadKm||0),unpaid=Number(t.unpaidKm||0),cost=(km+dead+unpaid)*Number(db.settings.costPerKm||0),rateKm=km?expected/km:0,rateHr=mins?expected/(mins/60):0;return{expected,paid,diff:expected-paid,km,mins,dead,unpaid,cost,net:expected-cost,rateKm,rateHr}};
function lifecycleAction(t,next,label){return `<button class="primary life" data-next="${next}">${label}</button>`}
function editTrip(id){let t=db.trips.find(x=>x.id===id);if(!t)return history();let d=derived(t),next='';if(t.state==='OFFER CAPTURED')next=lifecycleAction(t,'ACCEPTED','ACCEPT TRIP');else if(t.state==='ACCEPTED')next=lifecycleAction(t,'PICKUP','ARRIVED AT PICKUP');else if(t.state==='PICKUP')next=lifecycleAction(t,'IN PROGRESS','START TRIP');else if(t.state==='IN PROGRESS')next=lifecycleAction(t,'COMPLETED','COMPLETE TRIP');else if(t.state==='COMPLETED')next=lifecycleAction(t,'EXPECTED PAYMENT','EXPECT PAYMENT');
panel('Trip Record',`<div class="panelcard"><span class="hint">${t.platform||'Unknown platform'} · ${new Date(t.createdAt).toLocaleString()}</span><h2>${t.pickupArea||'Unknown pickup'} → ${t.dropoffArea||'Unknown destination'}</h2><span class="status">${t.state}</span><div class="kpis" style="margin-top:14px"><div class="kpi"><small>Offer</small><b>${money(t.offeredFare)}</b></div><div class="kpi"><small>Outstanding</small><b class="${d.diff>0?'warn':'good'}">${money(Math.max(0,d.diff))}</b></div><div class="kpi"><small>$/km</small><b>${d.rateKm?money(d.rateKm):'—'}</b></div><div class="kpi"><small>$/hour</small><b>${d.rateHr?money(d.rateHr):'—'}</b></div></div></div>${next?`<div class="panelcard"><h2>Driving lifecycle</h2>${next}</div>`:''}<div class="panelcard"><h2>Trip details</h2><div class="row"><div class="field"><label>Platform</label><select id="platform"><option ${t.platform==='Uber'?'selected':''}>Uber</option><option ${t.platform==='Lyft'?'selected':''}>Lyft</option><option ${t.platform==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>State</label><select id="state">${['OFFER CAPTURED','ACCEPTED','PICKUP','IN PROGRESS','COMPLETED','EXPECTED PAYMENT','PAID','PAYMENT DELAYED','UNDER REVIEW','DISCREPANCY','RECONCILED'].map(s=>`<option ${s===t.state?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Pickup</label><input id="pickup" value="${esc(t.pickupArea||'')}"></div><div class="field"><label>Drop-off</label><input id="dropoff" value="${esc(t.dropoffArea||'')}"></div><div class="row"><div class="field"><label>Offer fare</label><input id="offer" type="number" step=".01" value="${t.offeredFare??''}"></div><div class="field"><label>Expected fare</label><input id="exp" type="number" step=".01" value="${t.expectedFare??t.offeredFare??''}"></div></div><div class="row"><div class="field"><label>Est. km</label><input id="estkm" type="number" step=".1" value="${t.estimatedKm??''}"></div><div class="field"><label>Est. minutes</label><input id="estmin" type="number" step="1" value="${t.estimatedMinutes??''}"></div></div><div class="field"><label>Notes</label><textarea id="notes">${esc(t.notes||'')}</textarea></div><button class="secondary" id="detailSave">Save details</button></div><div class="panelcard"><h2>Earnings Guardian</h2><div class="row"><div class="field"><label>Actual fare</label><input id="actualFare" type="number" step=".01" value="${t.actualFare??''}"></div><div class="field"><label>Actual payment</label><input id="act" type="number" step=".01" value="${t.actualPayment??''}"></div></div><div class="field"><label>Payment method/account</label><input id="payMethod" value="${esc(t.paymentMethod||'')}"></div><div class="actionbar"><button class="secondary" id="paySave">Save payment</button><button class="secondary" id="review">Mark under review</button></div></div><div class="panelcard"><h2>Opportunity cost</h2><div class="row"><div class="field"><label>Paid km</label><input id="paidkm" type="number" step=".1" value="${t.paidKm??''}"></div><div class="field"><label>Unpaid km</label><input id="unpaidkm" type="number" step=".1" value="${t.unpaidKm??''}"></div></div><div class="field"><label>Deadhead km</label><input id="deadkm" type="number" step=".1" value="${t.deadheadKm??''}"></div><div class="metric"><span>Estimated vehicle cost</span><b>${money(d.cost)}</b></div><div class="metric"><span>Estimated net</span><b>${money(d.net)}</b></div><button class="secondary" id="kmSave">Save distance</button></div><div class="panelcard"><h2>Driver Black Box</h2><p class="hint">Original source: ${t.source}. Field provenance and every conflicting update are retained.</p>${Object.entries(t.provenance||{}).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('')}<div class="timeline" style="margin-top:14px">${(t.changes||[]).slice().reverse().map(c=>`<div class="event"><b>${esc(c.field)}</b><small>${new Date(c.at).toLocaleString()} · ${c.source}<br>${esc(String(c.from??'—'))} → ${esc(String(c.to??'—'))}</small></div>`).join('')||'<div class="empty">No changes yet.</div>'}</div>${(t.evidence||[]).map(e=>e.type==='screenshot'?`<img class="preview" src="${e.data}">`:'').join('')}</div><button class="danger" id="deleteTrip">Delete this record</button>`);
$$('.life').forEach(b=>b.onclick=()=>{setField(t,'state',b.dataset.next,'MANUAL');if(b.dataset.next==='COMPLETED'&&!t.expectedFare)setField(t,'expectedFare',t.offeredFare,'SYSTEM_INFERENCE');if(b.dataset.next==='COMPLETED')setField(t,'completedAt',new Date().toISOString(),'SYSTEM_INFERENCE');save();editTrip(id)});$('#detailSave').onclick=()=>{[['platform','#platform'],['state','#state'],['pickupArea','#pickup'],['dropoffArea','#dropoff'],['offeredFare','#offer'],['expectedFare','#exp'],['estimatedKm','#estkm'],['estimatedMinutes','#estmin'],['notes','#notes']].forEach(([k,q])=>setField(t,k,['offeredFare','expectedFare','estimatedKm','estimatedMinutes'].includes(k)?(+$(q).value||null):$(q).value,'MANUAL'));save();editTrip(id)};$('#paySave').onclick=()=>{setField(t,'actualFare',+$('#actualFare').value||0,'MANUAL');setField(t,'actualPayment',+$('#act').value||0,'MANUAL');setField(t,'paymentMethod',$('#payMethod').value,'MANUAL');if(t.actualPayment>0)setField(t,'paymentTimestamp',new Date().toISOString(),'SYSTEM_INFERENCE');let x=derived(t);setField(t,'state',Math.abs(x.diff)<.01?'RECONCILED':t.actualPayment>0?'DISCREPANCY':'EXPECTED PAYMENT','SYSTEM_INFERENCE');save();editTrip(id)};$('#review').onclick=()=>{setField(t,'state','UNDER REVIEW','MANUAL');save();editTrip(id)};$('#kmSave').onclick=()=>{setField(t,'paidKm',+$('#paidkm').value||0,'MANUAL');setField(t,'unpaidKm',+$('#unpaidkm').value||0,'MANUAL');setField(t,'deadheadKm',+$('#deadkm').value||0,'MANUAL');save();editTrip(id)};$('#deleteTrip').onclick=()=>{if(confirm('Delete this trip record?')){db.trips=db.trips.filter(x=>x.id!==id);save();history()}}}
function history(){panel('Driver Black Box',`<div class="panelcard"><h2>${db.trips.length} records</h2>${db.trips.length?db.trips.map(t=>`<div class="trip" data-id="${t.id}"><b>${t.pickupArea||'Unknown'} → ${t.dropoffArea||'Unknown'} · ${money(t.offeredFare)}</b><small>${new Date(t.createdAt).toLocaleString()} · ${t.source}</small><span class="status">${t.state}</span></div>`).join(''):'<p class="hint">No trips captured yet.</p>'}</div>`);$$('.trip').forEach(x=>x.onclick=()=>editTrip(x.dataset.id))}
function earnings(){let now=Date.now(),delay=Number(db.settings.autoDelayHours||72)*36e5;db.trips.forEach(t=>{if(['COMPLETED','EXPECTED PAYMENT'].includes(t.state)&&t.completedAt&&now-new Date(t.completedAt).getTime()>delay&&!Number(t.actualPayment||0))setField(t,'state','PAYMENT DELAYED','SYSTEM_INFERENCE')});let rows=db.trips.map(t=>{let d=derived(t);return{t,...d}}).filter(x=>x.expected||x.paid),out=rows.reduce((s,x)=>s+Math.max(0,x.diff),0),confirmed=rows.reduce((s,x)=>s+x.paid,0);panel('Earnings Guardian',`<div class="kpis"><div class="kpi"><small>Unresolved</small><b class="${out?'warn':'good'}">${money(out)}</b></div><div class="kpi"><small>Confirmed paid</small><b>${money(confirmed)}</b></div></div><div class="panelcard" style="margin-top:12px"><h2>Reconciliation</h2>${rows.map(x=>`<div class="trip" data-id="${x.t.id}"><b>${esc(x.t.dropoffArea||'Trip')} · ${money(x.expected)} expected</b><small>${money(x.paid)} paid · ${money(x.diff)} difference</small><span class="status">${Math.abs(x.diff)<.01?'RECONCILED':x.t.state}</span></div>`).join('')||'<div class="empty">Complete a trip to begin reconciliation.</div>'}</div>`);$$('.trip').forEach(x=>x.onclick=()=>editTrip(x.dataset.id))}
function analytics(){let paid=db.trips.reduce((s,t)=>s+Number(t.paidKm||0),0),unpaid=db.trips.reduce((s,t)=>s+Number(t.unpaidKm||0),0),dead=db.trips.reduce((s,t)=>s+Number(t.deadheadKm||0),0),gross=db.trips.reduce((s,t)=>s+Number(t.actualPayment||0),0),expected=db.trips.reduce((s,t)=>s+Number(t.expectedFare??t.offeredFare??0),0),hrs=Math.max((Date.now()-db.shiftStart)/36e5,.01),cost=(paid+unpaid+dead)*Number(db.settings.costPerKm||0),net=gross-cost;panel('Shift Analytics',`<div class="kpis"><div class="kpi"><small>Confirmed</small><b>${money(gross)}</b></div><div class="kpi"><small>Net est.</small><b>${money(net)}</b></div><div class="kpi"><small>$/hour</small><b>${money(gross/hrs)}</b></div><div class="kpi"><small>$/paid km</small><b>${paid?money(gross/paid):'—'}</b></div></div><div class="panelcard" style="margin-top:12px"><h2>Distance & opportunity cost</h2><div class="metric"><span>Paid km</span><b>${paid.toFixed(1)}</b></div><div class="metric"><span>Unpaid km</span><b>${unpaid.toFixed(1)}</b></div><div class="metric"><span>Deadhead km</span><b>${dead.toFixed(1)}</b></div><div class="metric"><span>Vehicle cost estimate</span><b>${money(cost)}</b></div><div class="metric"><span>Expected earnings captured</span><b>${money(expected)}</b></div><div class="metric"><span>Trips recorded</span><b>${db.trips.length}</b></div></div><button class="secondary" id="newShift">Close & start new shift</button>`);$('#newShift').onclick=()=>{db.shiftHistory.push({startedAt:new Date(db.shiftStart).toISOString(),endedAt:new Date().toISOString(),gross,expected,trips:db.trips.length,paidKm:paid,unpaidKm:unpaid,deadheadKm:dead});db.shiftStart=Date.now();save();analytics()}}
function settings(){panel('Settings',`<div class="panelcard"><h2>Work Zone Eligibility</h2><div class="toggle"><div><b>Toronto</b><small class="hint">User-controlled eligibility. OFF means no Toronto target recommendations.</small></div><input id="toronto" type="checkbox" ${db.settings.toronto?'checked':''}></div></div><div class="panelcard"><h2>Private home setting</h2><div class="field"><label>Home destination</label><input id="homeSet" value="${esc(db.settings.home||'')}" placeholder="Stored only in this browser"></div><div class="row"><div class="field"><label>Max detour km</label><input id="detour" type="number" value="${db.settings.detourKm||12}"></div><div class="field"><label>Priority</label><select id="priority"><option value="balanced" ${db.settings.homePriority==='balanced'?'selected':''}>Balanced</option><option value="arrival" ${db.settings.homePriority==='arrival'?'selected':''}>Arrival</option><option value="earnings" ${db.settings.homePriority==='earnings'?'selected':''}>Earnings</option></select></div></div><div class="row"><div class="field"><label>Payment delay alert (hours)</label><input id="delay" type="number" value="${db.settings.autoDelayHours||72}"></div><div class="field"><label>Vehicle cost / km</label><input id="costkm" type="number" step=".01" value="${db.settings.costPerKm||.28}"></div></div><button class="primary" id="setSave">Save settings</button></div><div class="panelcard"><h2>Data & integrations</h2><p class="hint">Uber API: REQUIRES EXTERNAL ACCESS<br>Lyft API: REQUIRES EXTERNAL ACCESS<br>OpenAI vision/Copilot: REQUIRES SERVER-SIDE API CREDENTIAL<br>Voice recognition: browser/device capability<br>Core app + local analytics: WORKING</p><div class="actionbar"><button class="secondary" id="export">Export data</button><button class="secondary" id="importBtn">Import data</button></div><input id="importFile" type="file" accept="application/json" style="display:none"></div>`);$('#setSave').onclick=()=>{db.settings.toronto=$('#toronto').checked;db.settings.home=$('#homeSet').value;db.settings.detourKm=+$('#detour').value||12;db.settings.homePriority=$('#priority').value;db.settings.autoDelayHours=+$('#delay').value||72;db.settings.costPerKm=+$('#costkm').value||.28;save();settings()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='rideshare-os-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=()=>{let f=$('#importFile').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.trips))throw Error('Invalid backup');db=x;db.settings={toronto:false,home:'',detourKm:12,homePriority:'balanced',autoDelayHours:72,costPerKm:.28,...(db.settings||{})};save();settings()}catch(e){alert('Could not import: '+e.message)}};r.readAsText(f)}}
function home(){let zones=zoneStats().filter(z=>db.settings.toronto||!/toronto/i.test(z.name));panel('Get Me Home',`<div class="panelcard"><h2>${db.settings.home?'Home: '+esc(db.settings.home):'Home not configured'}</h2><div class="kpis"><div class="kpi"><small>Max detour</small><b>${db.settings.detourKm||12} km</b></div><div class="kpi"><small>Priority</small><b>${db.settings.homePriority||'balanced'}</b></div></div><p class="hint">Candidate stepping-stones come from your own trip history and respect work-zone eligibility. Live route geometry remains unavailable until a maps provider is connected.</p></div><div class="panelcard"><h2>Historical stepping-stones</h2>${zones.slice(0,5).map(z=>`<div class="trip"><b>${esc(z.name)}</b><small>${z.count} observations · ${money(z.avg)} average</small><span class="status">${z.count>=3?'HISTORICALLY STRONG':'LEARNING'}</span></div>`).join('')||'<div class="empty">Capture trips to learn routes toward home.</div>'}</div><button class="secondary" id="homeSettings">Configure home</button>`);$('#homeSettings').onclick=settings}
function zoneStats(){let m={};db.trips.forEach(t=>{let n=t.pickupArea||t.dropoffArea;if(!n)return;m[n]??={name:n,count:0,total:0};m[n].count++;m[n].total+=Number(t.actualPayment??t.expectedFare??t.offeredFare??0)});return Object.values(m).map(z=>({...z,avg:z.total/z.count})).sort((a,b)=>b.count-a.count||b.avg-a.avg)}
function hotspots(){let z=zoneStats().filter(x=>db.settings.toronto||!/toronto/i.test(x.name));panel('Hotspot Intelligence',`<div class="panelcard"><h2>Personal hotspots</h2><p class="hint">Based only on your captured trip history. Toronto eligibility is ${db.settings.toronto?'ON':'OFF'}.</p>${z.map((x,i)=>`<div class="trip"><b>${x.name}</b><small>${x.count} observed trip${x.count===1?'':'s'} · ${money(x.avg)} average</small><span class="status">${x.count>=3?'HISTORICALLY STRONG':x.count===2?'BUILDING':'EARLY SIGNAL'}</span></div>`).join('')||'<p class="hint">No personal hotspot history yet.</p>'}</div>`)}
function current(){let t=db.trips.find(t=>!['PAID','RECONCILED','OFFER CAPTURED'].includes(t.state))||db.trips[0];if(t)editTrip(t.id);else capture()}
function structured(){return{trips:db.trips.map(({evidence,...t})=>t),settings:{toronto:db.settings.toronto,homeConfigured:!!db.settings.home,detourKm:db.settings.detourKm},zones:zoneStats(),shiftStart:db.shiftStart}}
function localAnswer(q){q=q.toLowerCase();let out=db.trips.reduce((s,t)=>s+Math.max(0,Number(t.expectedFare??t.offeredFare??0)-Number(t.actualPayment||0)),0),paid=db.trips.reduce((s,t)=>s+Number(t.actualPayment||0),0),unpaid=db.trips.reduce((s,t)=>s+Number(t.unpaidKm||0),0);if(q.includes('outstanding')||q.includes("hasn't paid")||q.includes('not paid'))return `${money(out)} is currently unresolved across your captured records.`;if(q.includes('actually')&&q.includes('paid'))return `Confirmed payments recorded: ${money(paid)}.`;if(q.includes('unpaid driving'))return `You have recorded ${unpaid.toFixed(1)} km of unpaid driving.`;if(q.includes('reposition')||q.includes('where')){let z=zoneStats().filter(x=>db.settings.toronto||!/toronto/i.test(x.name))[0];return z?`${z.name} has the strongest personal signal in your current history (${z.count} observations, ${money(z.avg)} average). This is historical, not live demand.`:'There is not enough personal trip history yet to recommend a reposition area.'}if(q.includes('best trip')){let t=[...db.trips].sort((a,b)=>derived(b).net-derived(a).net)[0];return t?`${t.pickupArea||'Unknown'} to ${t.dropoffArea||'Unknown'} is your best recorded trip by estimated net: ${money(derived(t).net)}.`:'No trips recorded yet.'}if(q.includes('how am i doing')||q.includes('today')){let g=db.trips.reduce((s,t)=>s+Number(t.actualPayment||0),0);return `You have ${db.trips.length} recorded trips, ${money(g)} confirmed paid, ${money(out)} unresolved, and ${unpaid.toFixed(1)} km unpaid driving in the current local dataset.`}if(q.includes('home'))return db.settings.home?`Home is configured as ${db.settings.home}. Your max detour is ${db.settings.detourKm} km and priority is ${db.settings.homePriority}. Live routing requires a maps provider.`:'Home is not configured yet.';return `I can answer from your structured records. Ask about today, best trip, confirmed payments, outstanding earnings, unpaid driving, repositioning, or getting home.`}
function copilot(){panel('AI Copilot',`<div class="panelcard"><h2>Ask your data</h2><div class="field"><textarea id="q" placeholder="What’s still outstanding?"></textarea></div><button class="primary" id="ask">Ask Copilot</button><div id="answer" class="hint" style="margin-top:14px"></div></div>`);$('#ask').onclick=async()=>{let q=$('#q').value;if(!q)return;$('#answer').textContent='Thinking…';try{let r=await fetch('/api/copilot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:structured()})}),j=await r.json();if(!r.ok)throw Error(j.error);$('#answer').textContent=j.text}catch(e){$('#answer').textContent=localAnswer(q)+' (Local structured-data mode; OpenAI server connection unavailable.)'}}}
const providers={manual:{id:'MANUAL',available:true},voice:{id:'VOICE',available:!!(window.SpeechRecognition||window.webkitSpeechRecognition)},screenshot:{id:'SCREENSHOT',available:true},uber:{id:'UBER_API',available:false,reason:'External API access required'},lyft:{id:'LYFT_API',available:false,reason:'External API access required'}};
